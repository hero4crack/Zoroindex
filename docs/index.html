<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoroindex Ops | Plataforma de Gestión Operativa</title>
    <link rel="stylesheet" href="app.css">
    <style>
        .demo-banner {
            background: #1e293b;
            color: #e2e8f0;
            font-size: 12px;
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .demo-banner button {
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 5px;
            padding: 3px 9px;
            font-size: 11.5px;
            cursor: pointer;
        }
        .demo-banner button:hover {
            background: rgba(255,255,255,0.22);
        }
    </style>
</head>
<body>
    <div id="appRoot"></div>
    <script src="app.js"></script>
</body>
</html>
